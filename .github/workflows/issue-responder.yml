name: "Issue Responder"

# Answers brand-new issues automatically using the repo's docs and
# previously resolved issues, drafted by GitHub Copilot models
# (via the official actions/ai-inference action + Copilot CLI).

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to answer"
        required: true
        type: string

permissions:
  contents: read # read the checked-out documentation files
  issues: write # post comments on issues

concurrency:
  group: issue-responder-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  respond:
    runs-on: ubuntu-latest
    # Never react to bots (including other bots) to avoid reply loops.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.sender.type != 'Bot' }}
    steps:
      - name: Check out repository (documentation source)
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Gather context (docs + resolved issues)
        id: gather
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: node src/gather.js

      - name: Install Copilot CLI
        if: steps.gather.outputs.skip != 'true'
        run: npm install -g @github/copilot

      - name: Draft reply with Copilot
        id: inference
        if: steps.gather.outputs.skip != 'true'
        uses: actions/ai-inference@v3 # v3+ = Copilot CLI provider (GitHub Models retired July 2026)
        with:
          model: "" # empty = let Copilot CLI pick a model available on your plan (or pin e.g. claude-sonnet-4.5)
          system-prompt-file: _bot/system.txt
          prompt-file: _bot/prompt.txt
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

      - name: Post reply
        if: steps.gather.outputs.skip != 'true' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          {
            cat "${{ steps.inference.outputs.response-file }}"
            echo ""
            echo "---"
            echo "> 🤖 _Automated reply generated from this repo's docs and past resolved issues._ _If this solved your problem, feel free to close the issue — otherwise a maintainer will follow up._"
          } > comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file comment.md
